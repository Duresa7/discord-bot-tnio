[project]
name = "discord-bot-tnio"
version = "0.1.0"
description = "Keep a Discord schedule message synchronized with Google Calendar events."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
discord-bot = "discord_bot.bot:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
